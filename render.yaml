# MarketDesk on Render -- ONE free web service, nothing else.
#
# The 750 free instance-hours are per *workspace*, not per service: every free
# service that is up eats from the same pot, and when the pot is empty Render
# suspends them ALL. That is what happened to the previous workspace (11
# suspended services, "Monthly Quota Exceeded"). So this blueprint declares
# exactly one service. Do not add a second free service to "back it up".
#
# A free web service spins down after 15 minutes with no inbound traffic, so
# /health exists to be pinged from outside (see keepalive.py and README).
services:
  - type: web
    name: marketdesk
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: python3 -m compileall -q bot.py app.py keepalive.py
    startCommand: python3 app.py
    healthCheckPath: /health
    envVars:
      # Set the real token in the Render dashboard (Environment -> TG_TOKEN).
      # Never commit it. `sync: false` asks Render for the value at deploy time.
      - key: TG_TOKEN
        sync: false
      - key: DESK_SYMBOL
        value: XAUUSD
      # The owner's trigger levels, watched IN ADDITION to the built-in set and
      # the live pivots the watch now tracks on its own. 4080 is the pivot the
      # price is pinned to, 4035 and 4005 the supports below it. A crossing of
      # any sends ONE alert carrying the trade. Extend with a comma list.
      - key: DESK_WATCH_LEVELS
        value: "4080,4035,4005"
      # The news card pulls fresh headlines from Google News (keyless RSS),
      # ARABIC by default (queries: سعر الذهب / الفيدرالي / التضخم / الدولار;
      # feed locale ar / SA), cached 5 minutes. INFORMATION ONLY -- it never
      # opens, blocks or sizes a trade. Set to 0 to show only the hand-edited
      # NEWS_ITEMS list.
      - key: DESK_NEWS_LIVE
        value: "1"
      # The automatic direction alert: tell the owner when the net direction
      # flips (up/down/range) without a tap, with a 20-minute cooldown so a
      # chop cannot spam. Set to 0 to switch it off.
      - key: DESK_TREND_ALERTS
        value: "1"
      # The entry-zone heads-up: speak once as price reaches a desk buy/sell
      # zone, carrying the trade. Points within the zone that count as "near".
      - key: DESK_ENTRY_NEAR_PTS
        value: "6"
      # The owner's clock for every time the bot prints (news headlines come
      # stamped in GMT). Syria = UTC+3 and has had no DST since 2022, so a
      # fixed offset is exact; set 0 to show GMT.
      - key: DESK_TZ_OFFSET
        value: "3"
      # At most this many trades a day (raised to 20 on 2026-11-16; set 0 for no
      # cap). Counted on trades OPENED in the trading session.
      - key: DESK_MAX_TRADES_DAY
        value: "20"
      # The rest gap: after a trade CLOSES (win or loss), wait this many minutes
      # before the next entry. A fresh signal one second after a stop is usually
      # the same move taken again. Set 0 to disable.
      - key: DESK_REST_MINUTES
        value: "30"
      # The entry basis: how close to a level counts as "at the level" for a
      # sell-the-bounce / buy-the-dip entry. Widened 6 -> 12 (2026-11-16): at 6
      # the desk missed the 3,887.79 wall by 0.79 pts and could only chase the
      # breakdown. Set DESK_ENTRY_BASIS=0 to disable the rule entirely.
      - key: DESK_ENTRY_BASIS_PTS
        value: "12"
      # A RETRACE (the bounce) is exempt from the 15m candle filter, which by
      # construction refuses an entry above the 15m EMA20 -- i.e. every bounce.
      # Set DESK_BOUNCE_ENTRY=0 to restore the old veto (only breakdowns taken).
      - key: DESK_BOUNCE_ENTRY
        value: "1"
      # WHICH FRAME the entry basis reads. "1h" is stable but LATE -- the bar
      # closes an hour after the rejection, by which time the price has run and
      # the frames have flipped. This is the panel switch "باسيس سريع (فريم
      # 15د)": when the owner turns it on the basis is read on 15m instead, so
      # a wall rejection is caught ~45 min earlier and the desk sells the bounce
      # (3,881) not only the breakdown (3,860). Off by default; env here is only
      # the STARTING value the panel overrides and persists.
      - key: DESK_FAST_BASIS
        value: "0"
      # The combo quality gate is ON by default: ADX 0-50 + ATR 0.08-1.00% on
      # the 15m frame. Set DESK_FILTERS=0 to fall back to the raw frame tilt
      # (much noisier), or DESK_FILTER_GATES=adx,atr,macd,rsi to add the two
      # momentum gates the futures study used (they cost money on this bot).
      # - key: DESK_FILTERS
      #   value: "1"
      # - key: DESK_FILTER_GATES
      #   value: "adx,atr"
      # Optional: the chat that holds the pinned journal backup. Defaults to the
      # first allowed chat, so it normally needs no value.
      # - key: DESK_BACKUP_CHAT
      #   value: "123456789"
      # ENTRY TIMING. Default "immediate" = enter at market the moment the
      # signal fires (the desk's historical behaviour; the switch changes
      # nothing until you set it). "pullback" = park a LIMIT 0.5*ATR(15m) back
      # from the signal price and wait up to 12 bars for the retrace, the way a
      # human sells the BOUNCE rather than the middle of the range.
      # EVIDENCE IS MIXED, so leave this OFF unless you mean it: over the full
      # 2026 year the pullback wins (R/trade +0.118 -> +0.243), but on your REAL
      # 38-trade week the immediate entry won by 13.5R -- that week trended hard
      # and the limit missed 9 winners. The pullback wins 7 of 11 months (the
      # RANGE ones) and loses the strong-trend ones: it is a RANGE tool.
      # - key: DESK_ENTRY_MODE
      #   value: "pullback"
      # - key: DESK_PULLBACK_ATR
      #   value: "0.5"
      # - key: DESK_PULLBACK_WINDOW
      #   value: "12"

# Keep-alive as a Render Cron Job would also work, but a cron job is a PAID
# service type and a second service of any kind is a second way to trip the
# quota. Prefer the free external pinger (GitHub Actions or an uptime monitor);
# see README-render.md. Uncomment only if you accept the charge.

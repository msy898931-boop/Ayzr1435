# MarketDesk on Render -- ONE free web service, nothing else.
#
# The 750 free instance-hours are per *workspace*, not per service: every free
# service that is up eats from the same pot, and when the pot is empty Render
# suspends them ALL. That is what happened to the previous workspace (11
# suspended services, "Monthly Quota Exceeded"). So this blueprint declares
# exactly one service. Do not add a second free service to "back it up".
#
# A free web service spins down after 15 minutes with no inbound traffic, so
# /health exists to be pinged from outside (see keepalive.py and README).
services:
  - type: web
    name: marketdesk
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: python3 -m compileall -q bot.py app.py keepalive.py
    startCommand: python3 app.py
    healthCheckPath: /health
    envVars:
      # Set the real token in the Render dashboard (Environment -> TG_TOKEN).
      # Never commit it. `sync: false` asks Render for the value at deploy time.
      - key: TG_TOKEN
        sync: false
      - key: DESK_SYMBOL
        value: XAUUSD
      # The owner's trigger levels, watched IN ADDITION to the built-in set and
      # the live pivots the watch now tracks on its own. 4080 is the pivot the
      # price is pinned to, 4035 and 4005 the supports below it. A crossing of
      # any sends ONE alert carrying the trade. Extend with a comma list.
      - key: DESK_WATCH_LEVELS
        value: "4080,4035,4005"
      # The news card pulls fresh gold headlines from Google News (keyless RSS)
      # when this is 1. INFORMATION ONLY -- it never opens, blocks or sizes a
      # trade. Set to 0 to show only the hand-edited NEWS_ITEMS list.
      - key: DESK_NEWS_LIVE
        value: "1"
      # The owner's clock for every time the bot prints (news headlines come
      # stamped in GMT). Syria = UTC+3 and has had no DST since 2022, so a
      # fixed offset is exact; set 0 to show GMT.
      - key: DESK_TZ_OFFSET
        value: "3"
      # The combo quality gate is ON by default: ADX 20-40 + ATR 0.08-0.25% on
      # the 15m frame. Set DESK_FILTERS=0 to fall back to the raw frame tilt
      # (much noisier), or DESK_FILTER_GATES=adx,atr,macd,rsi to add the two
      # momentum gates the futures study used (they cost money on this bot).
      # - key: DESK_FILTERS
      #   value: "1"
      # - key: DESK_FILTER_GATES
      #   value: "adx,atr"
      # Optional: the chat that holds the pinned journal backup. Defaults to the
      # first allowed chat, so it normally needs no value.
      # - key: DESK_BACKUP_CHAT
      #   value: "123456789"

# Keep-alive as a Render Cron Job would also work, but a cron job is a PAID
# service type and a second service of any kind is a second way to trip the
# quota. Prefer the free external pinger (GitHub Actions or an uptime monitor);
# see README-render.md. Uncomment only if you accept the charge.
#
#   - type: cron
#     name: marketdesk-keepalive
#     runtime: python
#     plan: starter
#     region: oregon
#     schedule: "*/5 * * * *"
#     buildCommand: echo no build
#     startCommand: python3 keepalive.py https://marketdesk.onrender.com
